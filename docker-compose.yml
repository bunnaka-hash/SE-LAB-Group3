# PostgreSQL for the 'prod' profile.
#   export DB_PASSWORD=...        (never committed; compose refuses to start without it)
#   docker compose up -d
#   DB_URL=jdbc:postgresql://localhost:5432/shop DB_USER=shop ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD before starting PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shop-data:
