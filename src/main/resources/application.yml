spring:
  application:
    name: shop
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

shop:
  currency: USD
  tax-rate: 0.10
  low-stock-threshold: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "@project.description@"

logging:
  charset:
    console: UTF-8           
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-        }] %logger{30} : %msg%n"