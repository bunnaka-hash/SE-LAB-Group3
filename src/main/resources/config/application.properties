# Task 5 settings, kept in their own file so the Task 1-4 application.yml stays untouched.
# (classpath:/config/ is loaded in addition to application.yml / application.properties)

# request id in every log line (set by security/RequestIdFilter)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level rid=%X{rid} %logger{0} : %msg%n

# Lab only: also write HSTS on plain http://localhost. Production uses the default (HTTPS requests only).
shop.security.hsts-over-http=true
